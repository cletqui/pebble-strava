<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pebble Strava Setup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, sans-serif;
      background: #1a1a1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 28px 24px;
      max-width: 420px;
      width: 100%;
    }
    h1 { font-size: 22px; margin-bottom: 6px; }
    h1 span { color: #FC4C02; }
    .subtitle { color: #999; font-size: 14px; margin-bottom: 24px; }
    .step {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.5;
    }
    .step strong { color: #FC4C02; }
    .step a { color: #FC4C02; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: #ccc; }
    input {
      width: 100%;
      padding: 10px 12px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
      margin-bottom: 14px;
    }
    input:focus { outline: none; border-color: #FC4C02; }
    button {
      width: 100%;
      padding: 13px;
      background: #FC4C02;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover { background: #e04400; }
    button:disabled { background: #555; cursor: default; }
    .status { margin-top: 18px; padding: 12px; border-radius: 8px; font-size: 14px; }
    .status.success { background: #1a3a1a; color: #4caf50; }
    .status.error   { background: #3a1a1a; color: #f44336; }
    .status.info    { background: #1a2a3a; color: #64b5f6; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="card">
  <h1>Pebble <span>Strava</span></h1>
  <p class="subtitle">Connect your Strava account to record cycling and running workouts from your watch.</p>

  <div class="step">
    <strong>Step 1:</strong> Go to <a href="https://www.strava.com/settings/api" target="_blank">strava.com/settings/api</a>
    and create an app. Set the <strong>Authorization Callback Domain</strong> to
    <code>cletqui.github.io</code>.
  </div>

  <div id="form-section">
    <label for="client-id">Client ID</label>
    <input type="text" id="client-id" placeholder="123456" inputmode="numeric">

    <label for="client-secret">Client Secret</label>
    <input type="password" id="client-secret" placeholder="abc123...">

    <button id="auth-btn" onclick="authorize()">Connect to Strava</button>
  </div>

  <div id="status-box" class="status hidden"></div>
</div>

<script>
  var REDIRECT_URI = 'https://cletqui.github.io/pebble-strava/config/';

  function showStatus(msg, type) {
    var el = document.getElementById('status-box');
    el.textContent = msg;
    el.className = 'status ' + type;
  }

  function authorize() {
    var clientId     = document.getElementById('client-id').value.trim();
    var clientSecret = document.getElementById('client-secret').value.trim();

    if (!clientId || !clientSecret) {
      showStatus('Please enter both Client ID and Client Secret.', 'error');
      return;
    }

    sessionStorage.setItem('client_id',     clientId);
    sessionStorage.setItem('client_secret', clientSecret);

    var url = 'https://www.strava.com/oauth/authorize' +
      '?client_id='     + encodeURIComponent(clientId) +
      '&redirect_uri='  + encodeURIComponent(REDIRECT_URI) +
      '&response_type=code' +
      '&scope=activity%3Awrite%2Cread';

    window.location.href = url;
  }

  // Handle redirect back from Strava
  (function() {
    var params     = new URLSearchParams(window.location.search);
    var code       = params.get('code');
    var errorParam = params.get('error');

    if (errorParam) {
      showStatus('Authorization denied: ' + errorParam, 'error');
      return;
    }

    if (!code) return;

    var clientId     = sessionStorage.getItem('client_id');
    var clientSecret = sessionStorage.getItem('client_secret');

    document.getElementById('form-section').classList.add('hidden');

    if (!clientId || !clientSecret) {
      showStatus('Session expired — please reload the page and try again.', 'error');
      return;
    }

    showStatus('Exchanging authorization code for tokens…', 'info');

    fetch('https://www.strava.com/oauth/token', {
      method:  'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body:
        'client_id='     + encodeURIComponent(clientId) +
        '&client_secret='+ encodeURIComponent(clientSecret) +
        '&code='         + encodeURIComponent(code) +
        '&grant_type=authorization_code'
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data.access_token) {
        showStatus('Token exchange failed: ' + (data.message || JSON.stringify(data)), 'error');
        return;
      }

      showStatus('Connected! Sending tokens to your Pebble…', 'success');

      var result = {
        access_token:  data.access_token,
        refresh_token: data.refresh_token,
        expires_at:    data.expires_at,
        client_id:     clientId,
        client_secret: clientSecret
      };

      setTimeout(function() {
        window.location.href = 'pebblejs://close#' + encodeURIComponent(JSON.stringify(result));
      }, 1200);
    })
    .catch(function(err) {
      showStatus('Error: ' + err.message, 'error');
    });
  })();
</script>
</body>
</html>

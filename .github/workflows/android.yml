name: Android Release

on:
  push:
    tags:
      - 'android-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          TAG=${GITHUB_REF_NAME}
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             pebble-strava-companion-${TAG}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Companion ${{ github.ref_name }}"
          body: |
            ## Pebble Strava GPS Companion

            Android companion app for the Pebble Strava GPX Mailer watchapp.

            ### Install
            1. Enable **Install unknown apps** for your browser or file manager in Android Settings → Apps.
            2. Download `pebble-strava-companion-*.apk` below and open it to install.
            3. Grant location permissions (*Allow all the time*) when prompted.
            4. On Android 12+: open the app and grant **battery optimisation exemption** so GPS works in the background.

            ### How it works
            The companion auto-starts when you open the watchapp and stops after the GPX is sent (or when you close the watchapp).
            GPS tracking, distance, GPX building, and Worker upload all happen on the phone.
            Configure the Worker URL and secret once via **Pebble app → long-press Strava GPX Mailer → Settings**.
          files: pebble-strava-companion-*.apk
          draft: false
          prerelease: false

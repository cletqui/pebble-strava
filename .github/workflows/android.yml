name: Android Release

on:
  push:
    tags:
      - 'android-v*'
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          TAG=${GITHUB_REF_NAME}
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             pebble-strava-companion-${TAG}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Strava GPX ${{ github.ref_name }}"
          body: |
            ## Strava GPX — Android Companion ${{ github.ref_name }}

            Android companion app for the **Strava GPX** Pebble watchapp.
            GPS tracking, GPX building, and local save all happen on the phone.

            ### Install
            1. Enable **Install unknown apps** for your browser or file manager in Android Settings → Apps.
            2. Download `pebble-strava-companion-*.apk` below and open it to install.
            3. Grant location permissions (*Allow all the time*) when prompted.
            4. On Android 12+: open the app and tap **Disable Battery Optimization** → Allow.
               ⚠️ Without this, Android blocks GPS for background-started services and no fixes will arrive.

            ### What it does
            The companion auto-starts when you open the watchapp on your Pebble and stops after the GPX is saved.
            GPS tracking, Haversine distance, GPX building (with embedded heart rate), and optional Worker upload all run on the phone.

            Configure settings once via **Core Devices → long-press Strava GPX → ⚙ Settings**.
          files: pebble-strava-companion-*.apk
          draft: false
          prerelease: false
